<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – HouseLearning Pages</title>
  <link rel="stylesheet" href="styles.css" />

  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>

  <script defer src="js/firebase-init.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/treeview.js"></script>
  <script defer src="js/dashboard.js"></script>
  
  <style>
    /* Modal Styling */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 10% auto; padding: 20px; width: 400px; border-radius: 8px; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px; }
    .danger-zone { border: 1px solid #ffcccc; padding: 10px; margin-top: 20px; border-radius: 4px; }
    
    /* Progress Bar */
    #progress-container { width: 100%; background-color: #f3f3f3; border-radius: 4px; margin-top: 15px; display: none; }
    #progress-bar { width: 0%; height: 20px; background-color: #4CAF50; border-radius: 4px; text-align: center; line-height: 20px; color: white; font-size: 12px; transition: width 0.3s; }

    /* Context Menu Styling */
    #context-menu {
      display: none;
      position: fixed;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      z-index: 2000;
      min-width: 120px;
    }
    #context-menu ul { list-style: none; margin: 0; padding: 0; }
    #context-menu li { padding: 10px; cursor: pointer; color: red; }
    #context-menu li:hover { background: #eee; }

    /* Drag and Drop Visual Feedback */
    .drag-over { background-color: #e1f5fe !important; border: 1px dashed #2196F3; }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>HouseLearning Pages</h1>
    <div>
      <span id="user-email"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>

  <main class="dashboard-container">
    <aside class="sites-panel">
      <h2>Your Sites</h2>
      <button id="create-site-btn">New Site</button>
      <ul id="sites-list"></ul>
    </aside>

    <aside class="tree-panel hidden" id="tree-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 id="site-title" style="margin: 0;"></h2>
        <button id="settings-btn" style="background-color: #666; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px;">Settings</button>
      </div>
      
      <p class="site-url">URL: <code id="site-url"></code></p>

      <div class="tree-actions">
        <button id="new-folder-btn">New Folder</button>
        <button id="upload-files-btn">Upload File</button>
        <button id="upload-folder-btn">Upload Folder</button>
        <button id="save-all-btn" style="background-color: #2196F3; color: white;">Save All</button>
        
        <input type="file" id="file-input" multiple style="display:none;" />
        <input type="file" id="folder-input" multiple webkitdirectory directory style="display:none;" />
      </div>

      <div id="tree-root-drop" style="padding: 5px; font-size: 0.9em; color: #666; border-bottom: 1px solid #eee;">Project Root</div>
      <ul id="file-tree" class="treeview"></ul>

      <div id="progress-container">
        <div id="progress-bar">0%</div>
      </div>

      <button id="deploy-btn" class="deploy-btn" style="margin-top: 20px; width: 100%;">Deploy Site</button>
      <p id="deploy-status" style="margin-top: 10px; font-weight: bold;"></p>
    </aside>

    <section class="editor-panel hidden" id="editor-panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="editor-filename"></h2>
        <small>Press Ctrl+S to Save All</small>
      </div>
      <textarea id="editor-content" style="width: 100%; height: 400px; font-family: monospace;"></textarea>
      <button id="save-file-btn">Save Changes</button>
    </section>
  </main>

  <div id="context-menu">
    <ul>
      <li id="delete-tree-item">Delete</li>
    </ul>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <h3>Site Settings</h3>
      <div style="margin-bottom: 15px;">
        <label>Rename Site URL (Slug):</label><br>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
          <input type="text" id="rename-slug-input" placeholder="slug" style="flex-grow: 1; padding: 5px;">
          <button id="save-slug-btn">Update</button>
        </div>
        <small id="slug-status"></small>
      </div>
      <div class="danger-zone">
        <h4 style="color: red; margin-top: 0;">Danger Zone</h4>
        <button id="delete-site-btn" style="background-color: #f44336; color: white; border: none; padding: 8px 12px; cursor: pointer; width: 100%;">Delete Site Record</button>
      </div>
    </div>
  </div>
</body>
</html>
