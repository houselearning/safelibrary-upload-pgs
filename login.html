<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HouseLearning Pages – Login</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase SDK -->
  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>

  <script defer src="js/firebase-init.js"></script>
  <script defer src="js/auth.js"></script>
</head>

<body>
  <main class="container">
    <h1>HouseLearning Pages</h1>
    <p>Create and deploy static websites for free under <code>pages.houselearning.org</code>.</p>

    <section id="auth-section">
      <div id="login-form">
        <h2>Sign in</h2>

        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />

        <button id="login-btn">Continue</button>
        <p id="auth-error" class="error"></p>

        <p style="margin-top: 10px;">
          No account?
          <a href="signup.html">Create one</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    // Wait for Firebase to load
    document.addEventListener("DOMContentLoaded", () => {
      const auth = firebase.auth();

      const loginBtn = document.getElementById("login-btn");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const errorBox = document.getElementById("auth-error");

      // Auto-redirect if already logged in
      auth.onAuthStateChanged(user => {
        if (user) {
          window.location.href = "dashboard.html";
        }
      });

      loginBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const pass = passInput.value;

        errorBox.textContent = "";

        if (!email || !pass) {
          errorBox.textContent = "Please enter both email and password.";
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        try {
          await auth.signInWithEmailAndPassword(email, pass);
          window.location.href = "dashboard.html";
        } catch (err) {
          errorBox.textContent = err.message;
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Continue";
      });
    });
  </script>
</body>
</html>
