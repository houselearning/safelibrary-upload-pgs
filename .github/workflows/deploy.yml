name: User Site Deploy
on:
  repository_dispatch:
    types: [deploy-user-site]

# REQUIRED for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests  # THIS FIXES THE ERROR IN YOUR LOG

      - name: Fetch and Rebuild Site
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PROJECT_ID: "contract-center-llc-10"
          USER_UID: ${{ github.event.client_payload.uid }}
          SITE_ID: ${{ github.event.client_payload.siteId }}
        run: |
          python - <<EOF
          import os, requests, json
          doc_id = f"{os.environ['USER_UID']}_{os.environ['SITE_ID']}"
          url = f"https://firestore.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/databases/(default)/documents/siteFiles/{doc_id}?key={os.environ['FIREBASE_KEY']}"
          
          response = requests.get(url)
          data = response.json()
          
          if 'fields' not in data:
              print("Error: Document not found")
              exit(1)

          # CHANGE: We now create a folder named after the Site ID
          site_folder = os.path.join('out', os.environ['SITE_ID'])
          os.makedirs(site_folder, exist_ok=True)

          files = data['fields']['files']['arrayValue']['values']
          for file_obj in files:
              f = file_obj['mapValue']['fields']
              path = f['path']['stringValue']
              content = f['content']['stringValue']
              
              full_path = os.path.join(site_folder, path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              
              with open(full_path, 'w', encoding='utf-8') as f_out:
                  f_out.write(content)
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
