name: User Site Deploy
on:
  repository_dispatch:
    types: [deploy-user-site]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Fetch and Rebuild Site
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PROJECT_ID: "contract-center-llc-10"
          USER_UID: ${{ github.event.client_payload.uid }}
          SITE_ID: ${{ github.event.client_payload.siteId }}
        run: |
          python - <<EOF
          import os, requests, json

          # 1. Build the Firestore URL
          doc_id = f"{os.environ['USER_UID']}_{os.environ['SITE_ID']}"
          url = f"https://firestore.googleapis.com/v1/projects/{os.environ['PROJECT_ID']}/databases/(default)/documents/siteFiles/{doc_id}?key={os.environ['FIREBASE_KEY']}"
          
          # 2. Fetch the data
          response = requests.get(url)
          data = response.json()
          
          if 'fields' not in data:
              print("Error: Document not found in Firestore")
              exit(1)

          # 3. Create a public folder for the site
          os.makedirs('public', exist_ok=True)

          # 4. Extract files and write to disk
          files = data['fields']['files']['arrayValue']['values']
          for file_obj in files:
              f = file_obj['mapValue']['fields']
              path = f['path']['stringValue']
              content = f['content']['stringValue']
              
              # Ensure subdirectories exist
              os.makedirs(os.path.dirname(os.path.join('public', path)), exist_ok=True)
              
              with open(os.path.join('public', path), 'w', encoding='utf-8') as f_out:
                  f_out.write(content)
                  print(f"Created: {path}")
          EOF

      - name: Deploy to GitHub Pages (or Host)
        # Add your existing deployment step here (e.g., peaceiris/actions-gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
