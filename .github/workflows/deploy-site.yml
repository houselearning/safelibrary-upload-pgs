name: Deploy user site

on:
  repository_dispatch:
    types: [deploy-user-site]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse payload
        id: payload
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          cat payload.json

      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install fs-extra

      - name: Write site files
        run: |
          node << 'EOF'
          const fs = require('fs');
          const fse = require('fs-extra');

          const payload = JSON.parse(fs.readFileSync('payload.json', 'utf8'));

          const { uid, siteId, files } = payload;
          if (!uid || !siteId || !Array.isArray(files)) {
            throw new Error('Invalid payload: uid, siteId, files required');
          }

          const baseDir = `sites/${uid}/${siteId}`;
          fse.ensureDirSync(baseDir);

          for (const file of files) {
            const relPath = file.path.replace(/^\/+/, '');
            const targetPath = `${baseDir}/${relPath}`;
            fse.ensureDirSync(require('path').dirname(targetPath));
            fs.writeFileSync(targetPath, file.content, 'utf8');
          }

          EOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_PAT }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          PAGES_BRANCH: ${{ secrets.PAGES_BRANCH }}
        run: |
          git config user.name "houselearning-pages-bot"
          git config user.email "bot@houselearning.org"

          git add sites
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy site from workflow"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${PAGES_REPO}.git" HEAD:${PAGES_BRANCH}
